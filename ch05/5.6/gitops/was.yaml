# WAS(Flask) — 학습자료 5.4.7 1~5 (Flask 설치·서비스 등록)를 Deployment·Service로 옮긴 것
# 요청 흐름: NLB was-lb(was.cloud.local:5000) → was 노드 :30500 → Flask 파드 :5000 → db/redis.cloud.local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: was
  labels:
    app: was
spec:
  replicas: 2 # was1, was2
  selector:
    matchLabels:
      app: was
  template:
    metadata:
      labels:
        app: was
    spec:
      nodeSelector:
        tier: was # was-sg가 붙은 노드 → RDS·Redis 접근 가능
      topologySpreadConstraints: # 가용 영역마다 하나씩
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: was
      containers:
        - name: was
          # ECR 이미지 (app/was/Dockerfile: 패키지·앱 소스 포함). Argo CD가 이름 "was"를 ECR 주소로 바꾼다(argocd.tf kustomize.images).
          # 이미지를 바꾸려면 태그를 올리고 scripts/push-images.sh was 실행 → git push
          image: was:1.0.0
          ports:
            - containerPort: 5000
          startupProbe: # 패키지가 이미지에 있으므로 금방 뜬다 → 최대 1분 대기
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
# NLB(was-tg) → was 노드 :30500 → was 파드 :5000
apiVersion: v1
kind: Service
metadata:
  name: was
spec:
  type: NodePort
  selector:
    app: was
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500 # Argo CD가 var.was_node_port 값으로 덮어쓴다
      protocol: TCP
