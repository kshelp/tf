# Argo CD가 동기화하는 web·was 앱 매니페스트 (argocd.tf의 Application이 이 디렉터리를 가리킨다)
# 이 디렉터리를 수정해 Git에 push하면 Argo CD가 클러스터(양쪽 AZ의 web·was 노드)에 자동으로 반영한다.
#
# 테라폼과 맞물리는 값
#   was.yaml / web.yaml의 nodePort(30500 / 30080)는 로드 밸런서 대상 그룹 포트와 같아야 하므로
#   Argo CD Application이 테라폼 변수(was_node_port / web_node_port) 값으로 덮어쓴다(argocd.tf kustomize.patches).
#   여기 적힌 값은 kubectl kustomize 로 직접 렌더링할 때의 기본값이다.
#   이미지 이름(web, was)도 Application이 ECR 주소로 바꾼다(argocd.tf kustomize.images). 태그는 여기 매니페스트 값을 쓴다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - was.yaml
  - web.yaml

# NGINX 설정(default.conf)으로 ConfigMap web-nginx를 만든다.
# 이름 뒤에 내용 해시가 붙고(web-nginx-xxxxx) Deployment의 참조도 함께 바뀌므로,
# default.conf만 고쳐도 web 파드가 새 설정으로 다시 만들어진다.
configMapGenerator:
  - name: web-nginx
    files:
      - default.conf
